<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>能量工作室｜管理後台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(110, 70, 180, 0.18),
          transparent 45%
        ),
        #07070b;

      color: #f4f1fa;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,7,11,0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 5px;
      color: #9b96a8;
      font-size: 13px;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    main {
      padding: 45px 0 80px;
    }

    .login-card,
    .dashboard {
      width: 100%;
    }

    .card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.25);
    }

    .login-card {
      max-width: 440px;
      margin: 80px auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 22px;
    }

    .description {
      color: #aaa5b5;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 18px;
      color: #d9d4e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      outline: none;
      background: rgba(0,0,0,0.25);
      color: white;
    }

    input:focus {
      border-color: rgba(160,120,240,0.7);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
      background: #8d6be8;
      color: white;
      font-weight: 700;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 15px;
      color: #b8b2c2;
      font-size: 14px;
      line-height: 1.6;
    }

    .dashboard {
      display: none;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .refresh-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    .order-tools {
  margin-bottom: 16px;
}

.order-tools input {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: white;
  padding: 13px 15px;
  border-radius: 10px;
  outline: none;
  font-size: 14px;
}

.order-tools input::placeholder {
  color: #777080;
}

.order-tools input:focus {
  border-color: rgba(164,103,255,0.6);
  background: rgba(255,255,255,0.06);
}

    .orders {
      display: grid;
      gap: 16px;
    }

    .order {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.18);
      border-radius: 15px;
      padding: 20px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 15px;
    }

    .service {
      font-weight: 700;
      font-size: 17px;
    }

    .date {
      color: #8e8998;
      font-size: 12px;
      margin-top: 5px;
    }

    .status-badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-select {
  border: 1px solid rgba(255,255,255,0.12);
  background: #17151d;
  color: white;
  padding: 8px 12px;
  border-radius: 9px;
  cursor: pointer;
  outline: none;
}

.status-select:focus {
  border-color: rgba(160,120,240,0.7);
}

.status-select:disabled {
  opacity: 0.6;
  cursor: wait;
}

    .info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 20px;
      color: #c9c4d0;
      font-size: 14px;
      line-height: 1.6;
    }

    .info strong {
      color: white;
    }

    .details {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
      color: #c3becb;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .drive {
      display: inline-block;
      margin-top: 12px;
      color: #b69aff;
      word-break: break-all;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #8e8998;
    }

    @media (max-width: 650px) {
      .header-inner,
      .top-row {
        align-items: flex-start;
      }

      .info {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">
    <div>
      <div class="logo">能量工作室</div>
      <div class="subtitle">管理後台</div>
    </div>

    <button
      class="logout-btn"
      id="logoutBtn"
      style="display:none;"
    >
      登出
    </button>
  </div>
</header>


<main class="container">

  <!-- 登入 -->
  <section class="login-card card" id="loginCard">

    <h1>管理員登入</h1>

    <div class="description">
      只有管理員可以查看委託訂單。
    </div>

    <form id="loginForm">

      <label>
        Email
        <input
          type="email"
          id="email"
          required
          autocomplete="email"
          placeholder="你的管理員 Email"
        >
      </label>

      <label>
        Password
        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
          placeholder="你的密碼"
        >
      </label>

      <button
        type="submit"
        class="primary-btn"
        id="loginBtn"
      >
        登入
      </button>

    </form>

    <div class="status" id="loginStatus"></div>

  </section>


  <!-- 後台 -->
  <section class="dashboard" id="dashboard">

    <div class="top-row">

      <div>
        <h1>委託訂單</h1>

        <div class="subtitle">
          能量工作室｜訂單管理
        </div>
      </div>

      <button
        class="refresh-btn"
        id="refreshBtn"
      >
        ↻ 重新整理
      </button>

    </div>

        <section class="service-manager">

      <h2>服務管理</h2>

          <div class="add-service">

  <input
    type="text"
    id="newServiceName"
    placeholder="服務名稱，例如：短影音剪輯"
  >

  <input
    type="text"
    id="newPackageName"
    placeholder="套餐名稱，例如：四部"
  >

  <input
    type="number"
    id="newServicePrice"
    placeholder="價格"
    min="0"
    step="1"
  >

  <textarea
    id="newServiceDescription"
    placeholder="服務描述"
    rows="2"
  ></textarea>

  <button id="addServiceBtn">
    ＋ 新增服務
  </button>

</div>

      <div class="service-list" id="serviceList">

        <div class="card empty">
          載入服務中……
        </div>

      </div>

    </section>
    

<div class="order-tools">

  <input
    type="text"
    id="orderSearch"
    placeholder="🔎 搜尋客戶名稱、聯絡方式、服務..."
  >

</div>

<div class="orders" id="orders">
      <div class="card empty">
        載入訂單中……
      </div>

    </div>

  </section>

</main>


<script>

  const SUPABASE_URL =
    "https://qtceqmnbeobsndpwnisf.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_RzkPac46JOSRgGi2k34Jug_ddHxE-Nh";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const loginCard =
    document.getElementById("loginCard");

  const dashboard =
    document.getElementById("dashboard");

  const loginForm =
    document.getElementById("loginForm");

  const loginBtn =
    document.getElementById("loginBtn");

  const loginStatus =
    document.getElementById("loginStatus");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const orders =
    document.getElementById("orders");

  const serviceList =
  document.getElementById("serviceList");

  // =========================
  // 登入
  // =========================

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    loginBtn.disabled = true;

    loginStatus.textContent = "登入中……";


    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


    if (error) {

      console.error(error);

      loginStatus.textContent =
        "✕ 登入失敗：" + error.message;

      loginBtn.disabled = false;

      return;
    }


    loginStatus.textContent = "";

    showDashboard();

  });


  // =========================
  // 顯示後台
  // =========================

  async function showDashboard() {

    loginCard.style.display = "none";

    dashboard.style.display = "block";

    logoutBtn.style.display = "block";

    await loadOrders();

  }


  // =========================
  // 載入訂單
  // =========================

  async function loadOrders() {

    orders.innerHTML = `
      <div class="card empty">
        載入訂單中……
      </div>
    `;


    const {
      data,
      error
    } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      orders.innerHTML = `
        <div class="card empty">
          無法載入訂單。<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }


    if (!data || data.length === 0) {

      orders.innerHTML = `
        <div class="card empty">
          目前沒有訂單。
        </div>
      `;

      return;
    }


    orders.innerHTML = data
      .map(order => createOrderHTML(order))
      .join("");

  }

    async function loadServices() {

    serviceList.innerHTML = `
      <div class="card empty">
        載入服務中……
      </div>
    `;


    const {
      data,
      error
    } = await supabaseClient
      .from("services")
      .select("*")
      .order("id", {
        ascending: true
      });


    if (error) {

      console.error(error);

      serviceList.innerHTML = `
        <div class="card empty">
          無法載入服務。<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }


    if (!data || data.length === 0) {

      serviceList.innerHTML = `
        <div class="card empty">
          目前沒有服務。
        </div>
      `;

      return;
    }


    serviceList.innerHTML = data
      .map(service => `
        <div class="service-item">

          <div>
            <strong>
              ${escapeHtml(service.service)}
            </strong>

            <span>
              ${escapeHtml(service.package)}
            </span>

<textarea
  class="service-description-input"
  data-service-id="${escapeAttribute(service.id)}"
  rows="2"
  placeholder="服務描述"
>${escapeHtml(service.description || "")}</textarea>
            
          </div>

     <div class="service-price-edit">

  <span>HKD $</span>

  <input
    type="number"
    class="service-price-input"
    data-service-id="${escapeAttribute(service.id)}"
    value="${escapeAttribute(String(service.price))}"
    min="0"
    step="1"
  >

</div>

<button
  class="save-price-btn"
  data-service-id="${escapeAttribute(service.id)}"
>
  儲存
</button>

<button
  class="toggle-service-btn"
  data-service-id="${escapeAttribute(service.id)}"
  data-active="${service.active}"
>
  ${service.active ? "停用" : "啟用"}
</button>

<button
  class="delete-service-btn"
  data-service-id="${escapeAttribute(service.id)}"
>
  刪除
</button>

        </div>
      `)
      .join("");

  }

  // =========================
  // 訂單卡片
  // =========================

function createOrderHTML(order) {

  const date =
    order.created_at
      ? new Date(order.created_at).toLocaleString("zh-HK")
      : "未知";

  const currentStatus = order.status || "pending";

  return `
    <article class="order">

      <div class="order-top">

        <div>

          <div class="service">
            ${escapeHtml(order.service || "")}
          </div>

          <div class="date">
            ${escapeHtml(date)}
          </div>

        </div>

        <select
          class="status-select"
          data-order-id="${escapeAttribute(order.id)}"
          data-current-status="${escapeAttribute(currentStatus)}"
        >

          <option value="pending"
            ${currentStatus === "pending" ? "selected" : ""}>
            🟡 待處理
          </option>

          <option value="in_progress"
            ${currentStatus === "in_progress" ? "selected" : ""}>
            🔵 製作中
          </option>

          <option value="completed"
            ${currentStatus === "completed" ? "selected" : ""}>
            🟢 已完成
          </option>

          <option value="cancelled"
            ${currentStatus === "cancelled" ? "selected" : ""}>
            🔴 已取消
          </option>

        </select>

      </div>

      <div class="info">

        <div>
          客戶：
          <strong>
            ${escapeHtml(order.customer_name || "")}
          </strong>
        </div>

        <div>
          價格：
          <strong>
            HKD $${escapeHtml(String(order.price ?? ""))}
          </strong>
        </div>

        <div>
          套餐：
          <strong>
            ${escapeHtml(order.package || "")}
          </strong>
        </div>

        <div>
          聯絡方式：
          <strong>
            ${escapeHtml(order.contact_type || "")}
            /
            ${escapeHtml(order.contact || "")}
          </strong>
        </div>

      </div>

      <div class="details">

        <strong>需求：</strong>

        ${escapeHtml(order.details || "")}

        ${
          order.google_drive
            ? `
              <br>
              <a
                class="drive"
                href="${escapeAttribute(order.google_drive)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ↗ 開啟 Google Drive 素材
              </a>
            `
            : ""
        }

      </div>

    </article>
  `;
}


  // =========================
  // 登出
  // =========================

  logoutBtn.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    dashboard.style.display = "none";

    loginCard.style.display = "block";

    logoutBtn.style.display = "none";

    loginForm.reset();

    loginStatus.textContent = "";

  });


  // =========================
  // 重新整理
  // =========================



  refreshBtn.addEventListener("click", () => {

  loadOrders();
  loadServices();

});


document.addEventListener("change", async (event) => {

  if (!event.target.classList.contains("status-select")) {
    return;
  }

  const select = event.target;

  const orderId = select.dataset.orderId;
  const newStatus = select.value;
  const oldStatus = select.dataset.currentStatus;

  if (!orderId) {
    return;
  }

  select.disabled = true;

  const {
    error
  } = await supabaseClient
    .from("orders")
    .update({
      status: newStatus
    })
    .eq("id", orderId);

  if (error) {

    console.error(error);

    alert("更新訂單狀態失敗：" + error.message);

    select.value = oldStatus;

    select.disabled = false;

    return;
  }

  select.dataset.currentStatus = newStatus;

  select.disabled = false;

});


  document
  .getElementById("addServiceBtn")
  .addEventListener("click", async () => {

    const serviceName =
      document.getElementById("newServiceName").value.trim();

    const packageName =
      document.getElementById("newPackageName").value.trim();

    const price =
      Number(document.getElementById("newServicePrice").value);

    const description =
      document.getElementById("newServiceDescription").value.trim();

    if (!serviceName || !packageName) {
      alert("請填寫服務名稱和套餐名稱。");
      return;
    }

    if (!Number.isFinite(price) || price < 0) {
      alert("請輸入有效的價格。");
      return;
    }

    const button =
      document.getElementById("addServiceBtn");

    button.disabled = true;
    button.textContent = "新增中……";

    const { error } =
      await supabaseClient
        .from("services")
        .insert({
          service: serviceName,
          package: packageName,
          price: price,
          description: description,
          active: true
        });

    if (error) {

      console.error(error);

      alert("新增服務失敗：" + error.message);

      button.disabled = false;
      button.textContent = "＋ 新增服務";

      return;
    }

    document.getElementById("newServiceName").value = "";
    document.getElementById("newPackageName").value = "";
    document.getElementById("newServicePrice").value = "";
    document.getElementById("newServiceDescription").value = "";

    button.textContent = "✓ 已新增";

    await loadServices();

    setTimeout(() => {
      button.disabled = false;
      button.textContent = "＋ 新增服務";
    }, 1500);

  });

  document.addEventListener("click", async (event) => {

  if (!event.target.classList.contains("toggle-service-btn")) {
    return;
  }

  const button = event.target;
  const serviceId = button.dataset.serviceId;
  const currentActive = button.dataset.active === "true";
  const newActive = !currentActive;

  button.disabled = true;
  button.textContent = newActive ? "啟用中……" : "停用中……";

  const { error } = await supabaseClient
    .from("services")
    .update({
      active: newActive
    })
    .eq("id", serviceId);

  if (error) {

    console.error(error);

    alert("更新服務狀態失敗：" + error.message);

    button.disabled = false;
    button.textContent = currentActive ? "停用" : "啟用";

    return;
  }

  await loadServices();

});

  document.addEventListener("click", async (event) => {

  if (!event.target.classList.contains("delete-service-btn")) {
    return;
  }

  const button = event.target;
  const serviceId = button.dataset.serviceId;

  const confirmed = confirm(
    "確定要刪除這個套餐嗎？\n刪除後無法恢復。"
  );

  if (!confirmed) {
    return;
  }

  button.disabled = true;
  button.textContent = "刪除中……";

  const { error } = await supabaseClient
    .from("services")
    .delete()
    .eq("id", serviceId);

  if (error) {

    console.error(error);

    alert("刪除服務失敗：" + error.message);

    button.disabled = false;
    button.textContent = "刪除";

    return;
  }

  await loadServices();

});
  
document.addEventListener("click", async (event) => {
  if (!event.target.classList.contains("save-price-btn")) {
    return;
  }

  const button = event.target;
  const serviceId = button.dataset.serviceId;

  const input = document.querySelector(
    `.service-price-input[data-service-id="${serviceId}"]`
  );

  const descriptionInput = document.querySelector(
  `.service-description-input[data-service-id="${serviceId}"]`
);

  if (!input) {
    return;
  }

  const newPrice = Number(input.value);

  if (!Number.isFinite(newPrice) || newPrice < 0) {
    alert("請輸入有效的價格。");
    return;
  }

  button.disabled = true;
  button.textContent = "儲存中……";

  const { error } = await supabaseClient
    .from("services")
    .update({
     price: newPrice,
    description: descriptionInput
  ? descriptionInput.value.trim()
  : ""
    })
    .eq("id", serviceId);

  if (error) {

    console.error(error);

    alert("價格更新失敗：" + error.message);

    button.disabled = false;
    button.textContent = "儲存";

    return;
  }

  button.textContent = "✓ 已儲存";

  setTimeout(() => {
    button.disabled = false;
    button.textContent = "儲存";
  }, 1500);

});

// =========================
// 檢查目前登入狀態
// =========================

// =========================
// 檢查目前登入狀態
// =========================

async function checkSession() {

    const {
      data
    } = await supabaseClient.auth.getSession();


    if (data.session) {

      showDashboard();

    }

  }


  // =========================
  // HTML 安全處理
  // =========================

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  checkSession();
  loadServices();

</script>

</body>
</html>
