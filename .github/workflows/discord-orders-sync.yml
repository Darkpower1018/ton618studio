name: TON618 Discord Orders Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync-orders:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: discord-bot/package.json

      - name: Install dependencies
        working-directory: discord-bot
        run: npm install

      - name: Sync Discord order list
        working-directory: discord-bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORDERS_CHANNEL_ID: ${{ secrets.ORDERS_CHANNEL_ID }}
        run: node sync.js
