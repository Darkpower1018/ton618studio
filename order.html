<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>能量工作室｜查詢訂單</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030206;color:#f5f1fb;font-family:Arial,"Noto Sans TC",sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 70% 10%,rgba(104,40,210,.2),transparent 35%),#030206}
.container{width:min(760px,calc(100% - 32px));margin:auto}
header{padding:26px 0;border-bottom:1px solid #ffffff12}
.logo{font-weight:800;letter-spacing:.14em}
main{padding:70px 0}
.card{border:1px solid #ffffff12;background:linear-gradient(145deg,#0b0812,#07060a);padding:34px;border-radius:4px}
.eyebrow{font:10px monospace;letter-spacing:.25em;color:#a67ce1}
h1{font-size:44px;margin:12px 0}
h2{font-size:24px;margin:0 0 18px}
h3{font-size:14px;margin:0 0 14px;letter-spacing:.08em}
p{color:#817789;line-height:1.9}
form{display:grid;gap:16px}
label{font:10px monospace;color:#817789;display:grid;gap:7px}
input{background:#050407;border:1px solid #ffffff16;color:#eee;padding:13px;border-radius:3px;outline:0}
button{border:0;padding:14px;background:#f5f0fb;color:#09070d;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.status{min-height:20px;color:#a779d2;font-size:12px}
.result{margin-top:18px}
.row{padding:11px 0;border-bottom:1px solid #ffffff0d;color:#aaa2b4;line-height:1.7}
.row strong{color:#eee}
.pay{margin-top:18px}
.payment-box{margin-top:22px;padding-top:22px;border-top:1px solid #ffffff12}
.payment-method{margin:12px 0;padding:18px;border:1px solid #ffffff10;background:#050407;border-radius:4px}
.payment-method h3{color:#cfc7d8}
.paypal-buttons{min-height:44px}
.wallet-button{margin-top:10px}
.card-fields{display:grid;gap:10px;width:100%}
.card-field{min-height:46px;background:#fff;border-radius:4px;padding:6px;width:100%;min-width:0}
.card-submit{width:100%;margin-top:12px}
.small{font-size:11px;color:#6f6678}
.hidden{display:none}
.success{color:#86d8aa}
.error{color:#ff8f9b}
a{color:#b69aff}
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="logo">能量工作室</div>
  </div>
</header>
<main class="container">
  <div class="card">
    <div class="eyebrow">ORDER STATUS</div>
    <h1>查詢訂單</h1>
    <p>輸入訂單編號，以及你下單時使用的聯絡帳號。</p>

    <form id="lookupForm">
      <label>訂單編號
        <input id="orderNumber" required placeholder="例如 TON-20260925-0001">
      </label>
      <label>聯絡帳號
        <input id="contact" required placeholder="例如 agc_ton618">
      </label>
      <button id="lookupBtn">查詢 ↗</button>
      <div class="status" id="status"></div>
    </form>

    <div class="result" id="result"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qtceqmnbeobsndpwnisf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_RzkPac46JOSRgGi2k34Jug_ddHxE-Nh";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const form=document.getElementById("lookupForm");
const btn=document.getElementById("lookupBtn");
const status=document.getElementById("status");
const result=document.getElementById("result");

let activeOrder=null;
let paypalReady=false;
let paymentSdkPromise=null;

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function setStatus(message,type=""){
  status.className="status "+type;
  status.textContent=message;
}

async function createPayPalOrder(paymentSource=null){
  if(!activeOrder?.order_number) throw new Error("缺少訂單編號。");

  const response=await fetch("/api/create-checkout-session",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      order_number:activeOrder.order_number,
      ...(paymentSource ? {payment_source:paymentSource} : {})
    })
  });

  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"無法建立付款訂單。");
  return data;
}

async function capturePayPalOrder(paypalOrderId){
  const response=await fetch("/api/capture-paypal-order",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      order_number:activeOrder.order_number,
      paypal_order_id:paypalOrderId
    })
  });

  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"付款確認失敗。");
  return data;
}

async function loadPayPalSdk(){
  if(paymentSdkPromise) return paymentSdkPromise;

  paymentSdkPromise=(async()=>{
    const tokenResponse=await fetch("/api/paypal-client-token");
    const tokenData=await tokenResponse.json();
    if(!tokenResponse.ok) throw new Error(tokenData.error||"無法初始化付款元件。");

    await new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      const params=new URLSearchParams({
        "client-id":tokenData.client_id,
        "currency":"HKD",
        "intent":"capture",
        "components":"buttons,card-fields,applepay,googlepay,marks,funding-eligibility",
        "enable-funding":"card"
      });
      script.src="https://www.paypal.com/sdk/js?"+params.toString();
      script.dataset.clientToken=tokenData.client_token;
      script.onload=resolve;
      script.onerror=()=>reject(new Error("PayPal SDK 載入失敗。"));
      document.head.appendChild(script);
    });

    paypalReady=true;
    return tokenData;
  })();

  return paymentSdkPromise;
}

async function setupPaymentMethods(){
  if(!activeOrder || activeOrder.payment_status==="paid" || activeOrder.status==="cancelled") return;

  const box=document.getElementById("paymentBox");
  const loading=document.getElementById("paymentLoading");
  try{
    await loadPayPalSdk();
    loading.textContent="";

    const paypalButton=paypal.Buttons({
      fundingSource:paypal.FUNDING.PAYPAL,
      style:{
        layout:"vertical",
        shape:"rect",
        label:"paypal",
        height:48
      },
      createOrder:async()=>{
        const data=await createPayPalOrder();
        return data.paypal_order_id;
      },
      onApprove:async(data)=>{
        setStatus("正在確認 PayPal 付款……");
        try{
          await capturePayPalOrder(data.orderID);
          setStatus("✓ PayPal 付款已完成，訂單狀態已更新。","success");
          document.getElementById("paymentBox").innerHTML="<h3>付款完成</h3><p class='success'>✓ 已收到付款，你的訂單已進入處理流程。</p>";
        }catch(error){
          setStatus(error.message,"error");
        }
      },
      onCancel:()=>setStatus("付款已取消，你可以重新選擇付款方式。"),
      onError:(error)=>{
        console.error(error);
        setStatus("PayPal 付款失敗，請改用其他付款方式再試。","error");
      }
    });
    paypalButton.render("#paypalButtons");

    // PayPal 的卡片 funding button 會讓買家在進入結帳前就看到「信用卡／Debit Card」選項。
    const cardFundingButton=paypal.Buttons({
      fundingSource:paypal.FUNDING.CARD,
      style:{
        layout:"vertical",
        shape:"rect",
        label:"pay",
        height:48
      },
      createOrder:async()=>{
        const data=await createPayPalOrder({
          card:{
            attributes:{
              verification:{method:"SCA_WHEN_REQUIRED"}
            }
          }
        });
        return data.paypal_order_id;
      },
      onApprove:async(data)=>{
        setStatus("正在確認信用卡付款……");
        try{
          await capturePayPalOrder(data.orderID);
          setStatus("✓ 信用卡付款已完成，訂單狀態已更新。","success");
          document.getElementById("paymentBox").innerHTML="<h3>付款完成</h3><p class='success'>✓ 已收到付款，你的訂單已進入處理流程。</p>";
        }catch(error){
          setStatus(error.message,"error");
        }
      },
      onCancel:()=>setStatus("付款已取消，你可以重新選擇付款方式。"),
      onError:(error)=>{
        console.error(error);
        setStatus("信用卡付款失敗，請改用其他付款方式再試。","error");
      }
    });

    if(cardFundingButton.isEligible()){
      document.getElementById("cardFundingMethod").classList.remove("hidden");
      cardFundingButton.render("#cardFundingButton");
    }

    const cardFields=paypal.CardFields({
      createOrder:async()=>{
        const data=await createPayPalOrder();
        return data.paypal_order_id;
      },
      onApprove:async(data)=>{
        setStatus("正在確認信用卡付款……");
        try{
          await capturePayPalOrder(data.orderID);
          setStatus("✓ 信用卡付款已完成，訂單狀態已更新。","success");
          document.getElementById("paymentBox").innerHTML="<h3>付款完成</h3><p class='success'>✓ 已收到付款，你的訂單已進入處理流程。</p>";
        }catch(error){
          setStatus(error.message,"error");
        }
      },
      onError:(error)=>{
        console.error(error);
        setStatus("信用卡付款失敗，請檢查卡片資料後再試。","error");
      },
      style:{
        input:{
          "font-size":"16px",
          "font-family":"Arial, Noto Sans TC, sans-serif",
          color:"#17131c"
        },
        ".invalid":{color:"#b00020"}
      }
    });

    const cardFieldsEligible=cardFields.isEligible();
    const cardFieldsDiagnostic=document.getElementById("cardFieldsDiagnostic");
    cardFieldsDiagnostic.textContent=cardFieldsEligible
      ? "Card Fields：Eligible（可在本站直接輸入信用卡）"
      : "Card Fields：Not eligible（目前未提供本站直接輸入信用卡欄位）";
    cardFieldsDiagnostic.className="small "+(cardFieldsEligible ? "success" : "error");

    if(cardFieldsEligible){
      document.getElementById("cardMethod").classList.remove("hidden");
      cardFields.NameField().render("#cardName");
      cardFields.NumberField().render("#cardNumber");
      cardFields.ExpiryField().render("#cardExpiry");
      cardFields.CVVField().render("#cardCvv");

      document.getElementById("cardSubmit").addEventListener("click",async()=>{
        const button=document.getElementById("cardSubmit");
        button.disabled=true;
        button.textContent="處理中……";
        try{
          await cardFields.submit();
        }catch(error){
          console.error(error);
          setStatus(error?.message||"信用卡付款失敗，請檢查卡片資料。","error");
        }finally{
          button.disabled=false;
          button.textContent="使用信用卡付款";
        }
      });
    }

    await setupGooglePay();
    await setupApplePay();
  }catch(error){
    console.error(error);
    loading.textContent="付款元件暫時無法載入，請稍後再試。";
    setStatus(error.message,"error");
  }
}

async function setupGooglePay(){
  const container=document.getElementById("googlePayMethod");
  if(!window.google?.payments?.api || !window.paypal?.Googlepay) return;

  try{
    const googlepay=paypal.Googlepay();
    const config=await googlepay.config();

    const paymentsClient=new google.payments.api.PaymentsClient({
      environment:"PRODUCTION",
      paymentDataCallbacks:{
        onPaymentAuthorized:async(paymentData)=>{
          try{
            const data=await createPayPalOrder({
              google_pay:{
                attributes:{
                  verification:{method:"SCA_WHEN_REQUIRED"}
                }
              }
            });

            const confirm=await googlepay.confirmOrder({
              orderId:data.paypal_order_id,
              paymentMethodData:paymentData.paymentMethodData
            });

            if(confirm.status!=="APPROVED"){
              return {transactionState:"ERROR",error:{message:"Google Pay 付款未獲批准。"}};
            }

            await capturePayPalOrder(data.paypal_order_id);
            return {transactionState:"SUCCESS"};
          }catch(error){
            console.error(error);
            return {transactionState:"ERROR",error:{message:error.message}};
          }
        }
      }
    });

    const ready=await paymentsClient.isReadyToPay({
      allowedPaymentMethods:config.allowedPaymentMethods,
      apiVersion:config.apiVersion,
      apiVersionMinor:config.apiVersionMinor
    });

    if(!ready.result) return;

    const button=paymentsClient.createButton({
      buttonType:"pay",
      buttonColor:"black",
      onClick:async()=>{
        const request={
          apiVersion:config.apiVersion,
          apiVersionMinor:config.apiVersionMinor,
          allowedPaymentMethods:config.allowedPaymentMethods,
          merchantInfo:config.merchantInfo,
          transactionInfo:{
            countryCode:config.countryCode,
            currencyCode:"HKD",
            totalPriceStatus:"FINAL",
            totalPrice:Number(activeOrder.price).toFixed(2),
            totalPriceLabel:"能量工作室"
          },
          callbackIntents:["PAYMENT_AUTHORIZATION"]
        };
        await paymentsClient.loadPaymentData(request);
      }
    });

    container.classList.remove("hidden");
    document.getElementById("googlePayButton").appendChild(button);
  }catch(error){
    console.info("Google Pay unavailable:",error);
  }
}

async function setupApplePay(){
  const container=document.getElementById("applePayMethod");
  if(!window.ApplePaySession || !window.paypal?.Applepay) return;

  try{
    if(!ApplePaySession.canMakePayments()) return;

    const applepay=paypal.Applepay();
    const config=await applepay.config();
    if(!config.isEligible) return;

    container.classList.remove("hidden");

    const button=document.createElement("button");
    button.type="button";
    button.className="wallet-button";
    button.textContent="  使用 Apple Pay";
    button.addEventListener("click",async()=>{
      const request={
        countryCode:config.countryCode,
        currencyCode:"HKD",
        merchantCapabilities:config.merchantCapabilities,
        supportedNetworks:config.supportedNetworks,
        total:{
          label:"能量工作室",
          type:"final",
          amount:Number(activeOrder.price).toFixed(2)
        }
      };

      const session=new ApplePaySession(4,request);

      session.onvalidatemerchant=async(event)=>{
        try{
          const {merchantSession}=await applepay.validateMerchant({
            validationUrl:event.validationURL
          });
          session.completeMerchantValidation(merchantSession);
        }catch(error){
          console.error(error);
          session.abort();
        }
      };

      session.onpaymentauthorized=async(event)=>{
        try{
          const data=await createPayPalOrder({
            apple_pay:{
              attributes:{
                verification:{method:"SCA_WHEN_REQUIRED"}
              }
            }
          });

          const confirm=await applepay.confirmOrder({
            orderId:data.paypal_order_id,
            token:event.payment.token,
            billingContact:event.payment.billingContact
          });

          if(confirm.status!=="APPROVED"){
            session.completePayment(ApplePaySession.STATUS_FAILURE);
            return;
          }

          await capturePayPalOrder(data.paypal_order_id);
          session.completePayment(ApplePaySession.STATUS_SUCCESS);
          setStatus("✓ Apple Pay 付款已完成，訂單狀態已更新。","success");
          document.getElementById("paymentBox").innerHTML="<h3>付款完成</h3><p class='success'>✓ 已收到付款，你的訂單已進入處理流程。</p>";
        }catch(error){
          console.error(error);
          session.completePayment(ApplePaySession.STATUS_FAILURE);
          setStatus("Apple Pay 付款失敗，請改用其他付款方式。","error");
        }
      };

      session.begin();
    });

    container.appendChild(button);
  }catch(error){
    console.info("Apple Pay unavailable:",error);
  }
}

async function capturePayPalReturn(){
  const params=new URLSearchParams(location.search);
  const orderNumber=params.get("order");
  const paypalOrderId=params.get("token");

  if(params.get("paypal_return")!=="1" || !orderNumber || !paypalOrderId)return false;

  setStatus("正在確認 PayPal 付款……");

  try{
    const response=await fetch("/api/capture-paypal-order",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        order_number:orderNumber,
        paypal_order_id:paypalOrderId
      })
    });
    const data=await response.json();

    if(!response.ok) throw new Error(data.error||"付款確認失敗。");

    setStatus(data.paid
      ?"✓ PayPal 付款已完成，訂單狀態已更新。"
      :"PayPal 付款狀態已確認。","success");
    return true;
  }catch(error){
    console.error(error);
    setStatus(error.message,"error");
    return false;
  }
}

function saveLookupSession(orderNumber, contact){
  sessionStorage.setItem("ton618_order_lookup", JSON.stringify({orderNumber, contact}));
}

function getSavedLookupSession(){
  try{
    return JSON.parse(sessionStorage.getItem("ton618_order_lookup")||"null");
  }catch{
    return null;
  }
}

async function lookup(){
  const orderNumber=document.getElementById("orderNumber").value.trim();
  const contact=document.getElementById("contact").value.trim();

  setStatus("查詢中……");
  result.innerHTML="";
  btn.disabled=true;

  try{
    const {data,error}=await supabaseClient.rpc("lookup_order",{
      p_order_number:orderNumber,
      p_contact:contact
    });

    if(error)throw error;

    const order=data?.[0];

    if(!order){
      setStatus("找不到訂單，請確認資料是否正確。");
      return;
    }

    activeOrder=order;
    saveLookupSession(orderNumber, contact);

    const statusText={
      pending:"🟡 待處理",
      in_progress:"🔵 製作中",
      completed:"🟢 已完成",
      cancelled:"🔴 已取消"
    }[order.status]||order.status;

    const paymentText=order.payment_status==="paid"?"✓ 已付款":"尚未付款";

    result.innerHTML=`
      <div class="card">
        <div class="eyebrow">${escapeHtml(order.order_number)}</div>
        <h2>${escapeHtml(order.service)}｜${escapeHtml(order.package)}</h2>
        <div class="row">狀態：<strong>${escapeHtml(statusText)}</strong></div>
        <div class="row">付款：<strong>${escapeHtml(paymentText)}</strong></div>
        <div class="row">價格：<strong>HKD $${escapeHtml(String(order.price))}</strong></div>
        <div class="row">需求：<strong>${escapeHtml(order.details)}</strong></div>

        ${order.payment_status!=="paid" && order.status!=="cancelled" ? `
          <div class="payment-box" id="paymentBox">
            <h3>選擇付款方式</h3>
            <p class="small">付款由 PayPal 安全處理。實際可用的付款方式會依你的裝置、地區與 PayPal 商家資格自動顯示。</p>
            <div id="paymentLoading" class="status">正在載入付款方式……</div>

            <div class="payment-method">
              <h3>PayPal</h3>
              <div id="paypalButtons" class="paypal-buttons"></div>
            </div>

            <div id="cardFundingMethod" class="payment-method hidden">
              <h3>信用卡 / Debit Card</h3>
              <p class="small">直接選擇信用卡付款，不需要先進入 PayPal 再返回。</p>
              <div id="cardFundingButton" class="paypal-buttons"></div>
            </div>

            <div id="cardFieldsDiagnostic" class="small">Card Fields：正在檢查資格……</div>

            <div id="cardMethod" class="payment-method hidden">
              <h3>信用卡 / Debit Card</h3>
              <div class="card-fields">
                <div id="cardName" class="card-field"></div>
                <div id="cardNumber" class="card-field"></div>
                <div id="cardExpiry" class="card-field"></div>
                <div id="cardCvv" class="card-field"></div>
              </div>
              <button id="cardSubmit" class="card-submit">使用信用卡付款</button>
            </div>

            <div id="googlePayMethod" class="payment-method hidden">
              <h3>Google Pay</h3>
              <div id="googlePayButton"></div>
            </div>

            <div id="applePayMethod" class="payment-method hidden">
              <h3>Apple Pay</h3>
            </div>
          </div>
        ` : ""}
      </div>
    `;

    if(order.payment_status!=="paid" && order.status!=="cancelled"){
      setupPaymentMethods();
    }
  }catch(error){
    console.error(error);
    setStatus("查詢失敗，請稍後再試。","error");
  }finally{
    btn.disabled=false;
    btn.textContent="查詢 ↗";
  }
}

form.addEventListener("submit",event=>{
  event.preventDefault();
  lookup();
});

const params=new URLSearchParams(location.search);
const returnOrderNumber=params.get("order");
const savedLookup=getSavedLookupSession();

if(returnOrderNumber){
  document.getElementById("orderNumber").value=returnOrderNumber;
}

(async()=>{
  const returnedFromPayPal=await capturePayPalReturn();

  // PayPal 返回後 URL 不會保留查詢時輸入的 contact。
  // 同一個瀏覽器工作階段自動恢復，避免買家再次輸入聯絡帳號。
  if(
    returnOrderNumber &&
    savedLookup &&
    savedLookup.orderNumber===returnOrderNumber &&
    savedLookup.contact
  ){
    document.getElementById("contact").value=savedLookup.contact;
    await lookup();
  }else if(returnedFromPayPal){
    setStatus("付款頁已返回。請輸入下單時的聯絡帳號即可恢復訂單。");
  }
})();
</script>
<script src="https://pay.google.com/gp/p/js/pay.js"></script>
<script src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js"></script>
</body>
</html>
